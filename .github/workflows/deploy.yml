name: Deploy to Vercel

# Workflow desactivado — Vercel despliega automáticamente desde GitHub.
# Para monorepo, cada app tiene su Root Directory configurado en Vercel Dashboard.
# Actívalo solo si necesitas CI personalizado.
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App a desplegar (ej: veterinarios/veterinario-sedano)'
        required: true
        type: string

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        working-directory: apps/${{ github.event.inputs.app }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        working-directory: apps/${{ github.event.inputs.app }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        working-directory: apps/${{ github.event.inputs.app }}
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
